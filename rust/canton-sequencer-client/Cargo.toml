[package]
name = "canton-sequencer-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust gRPC client for Canton Sequencer with authentication support"
license = "Apache-2.0"
authors = ["Digital Asset"]

[dependencies]
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
